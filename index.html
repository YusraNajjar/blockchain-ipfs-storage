<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure File Uploader with Encryption + IPFS + Ethereum</title>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    padding: 30px 20px;
    text-align: center;
    max-width: 700px;
    margin: auto;
  }
  input[type="file"], input[type="text"] {
    margin: 10px 0;
    padding: 6px;
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
  }
  button {
    background-color: #007bff;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 8px 0;
    width: 100%;
    max-width: 300px;
    font-size: 14px;
  }
  #status {
    margin-top: 15px;
    font-weight: 600;
    white-space: pre-line;
    text-align: left;
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    min-height: 120px;
    max-height: 220px;
    overflow-y: auto;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.2em;
  }
  #ipfsHashBox {
    display: none;
    margin-top: 15px;
  }
</style>
</head>
<body>

  <h1>Upload File to IPFS + Ethereum with Encryption</h1>

  <input type="file" id="fileInput" />
  <button id="uploadButton">Encrypt, Upload & Store</button>

  <div id="ipfsHashBox">
    <p><strong>IPFS Hash:</strong></p>
    <input type="text" id="ipfsHashInput" readonly />
    <button onclick="downloadHash()">Download Hash</button>
  </div>

  <pre id="status"></pre>

  <script>
    const JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiIzNTgwMTRmMy1kMWVkLTRmMDgtYjg1Ni0zMzY3ZDhlM2VjZmYiLCJlbWFpbCI6Inl1c3JhLm5hamphci4yMDExQGdtYWlsLmNvbSIsImVtYWlsX3ZlcmlmaWVkIjp0cnVlLCJwaW5fcG9saWN5Ijp7InJlZ2lvbnMiOlt7ImRlc2lyZWRSZXBsaWNhdGlvbkNvdW50IjoxLCJpZCI6IkZSQTEifSx7ImRlc2lyZWRSZXBsaWNhdGlvbkNvdW50IjoxLCJpZCI6Ik5ZQzEifV0sInZlcnNpb24iOjF9LCJtZmFfZW5hYmxlZCI6ZmFsc2UsInN0YXR1cyI6IkFDVElWRSJ9LCJhdXRoZW50aWNhdGlvblR5cGUiOiJzY29wZWRLZXkiLCJzY29wZWRLZXlLZXkiOiJjMmQ1OWU0NmMyYzIzZjQ1M2M2ZiIsInNjb3BlZEtleVNlY3JldCI6IjFiZjY4ZmFkY2JiMjcxNjEzZDEyMmU1NzAxZDMwMWJmMWI0NTJjZDhjZWIyZmY3MGE3ZjQ0Y2Y5OWNkMjgyYjMiLCJleHAiOjE3ODU1ODkwMjB9.qK_YdSw3aOnk_obTVCrEtRXVq_qYxp9v4AcIiS3kT68';  // Put your Pinata JWT here
    const contractAddress = '0x7EF2e0048f5bAeDe046f6BF797943daF4ED8CB47';  // Your deployed contract address
    const contractABI = [
      {
        "inputs": [{ "internalType": "string", "name": "ipfsHash", "type": "string" }],
        "name": "uploadHash",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      }
    ];

    function logStatus(message) {
      const status = document.getElementById('status');
      status.textContent += message + '\n';
      console.log(message);
    }

    async function encryptFile(file) {
      const key = await crypto.subtle.generateKey(
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );

      const rawKey = await crypto.subtle.exportKey("raw", key);
      const keyBase64 = btoa(String.fromCharCode(...new Uint8Array(rawKey)));

      const fileBuffer = await file.arrayBuffer();

      const iv = crypto.getRandomValues(new Uint8Array(12));

      const encryptedBuffer = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        fileBuffer
      );

      const encryptedBlob = new Blob([iv, new Uint8Array(encryptedBuffer)], { type: 'application/octet-stream' });

      return {
        encryptedFile: encryptedBlob,
        encryptionKey: keyBase64
      };
    }

    document.getElementById('uploadButton').onclick = async function uploadEncrypted() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const hashInput = document.getElementById('ipfsHashInput');
      const hashBox = document.getElementById('ipfsHashBox');

      status.textContent = '';
      hashBox.style.display = 'none';
      hashInput.value = '';

      if (fileInput.files.length === 0) {
        status.textContent = '❌ Please select a file.';
        return;
      }

      const file = fileInput.files[0];

      try {
        logStatus('Uploading encrypted file to IPFS...');
        const { encryptedFile, encryptionKey } = await encryptFile(file);

        const formData = new FormData();
        formData.append('file', encryptedFile, file.name + '.enc');

        const response = await axios.post(
          'https://api.pinata.cloud/pinning/pinFileToIPFS',
          formData,
          {
            maxContentLength: Infinity,
            headers: {
              Authorization: `Bearer ${JWT}`,
              'Content-Type': 'multipart/form-data',
            }
          }
        );

        if (!response || !response.data || !response.data.IpfsHash) {
          throw new Error('No IPFS hash received');
        }

        const ipfsHash = response.data.IpfsHash;
        const ipfsLink = `https://gateway.pinata.cloud/ipfs/${ipfsHash}`;

        logStatus(`✅ Uploaded to IPFS: ${ipfsHash}`);

        hashInput.value = ipfsHash;
        hashBox.style.display = 'block';

        if (!window.ethereum) {
          alert('❌ MetaMask not found. Please install it.');
          logStatus('MetaMask not found, stopping.');
          return;
        }

        logStatus('Connecting to MetaMask...');
        await window.ethereum.request({ method: 'eth_requestAccounts' });

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        const contract = new ethers.Contract(contractAddress, contractABI, signer);

        logStatus('Sending transaction to Ethereum...');
        const tx = await contract.uploadHash(ipfsHash, { gasLimit: 300000 });
        logStatus(`Transaction sent (hash: ${tx.hash}), waiting for confirmation...`);
        await tx.wait();

        logStatus('✅ Transaction confirmed! Hash stored on Ethereum.');

        const keyBlob = new Blob([encryptionKey], { type: 'text/plain' });
        const keyUrl = URL.createObjectURL(keyBlob);
        const keyLink = document.createElement('a');
        keyLink.href = keyUrl;
        keyLink.download = 'encryption_key.txt';
        keyLink.textContent = '⬇ Download Encryption Key';
        keyLink.style.display = 'block';
        document.body.appendChild(keyLink);

      } catch (error) {
        logStatus(`❌ Error: ${error.message || error}`);
      }
    };

    function downloadHash() {
      const hash = document.getElementById('ipfsHashInput').value;
      const blob = new Blob([hash], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "ipfs_hash.txt";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
