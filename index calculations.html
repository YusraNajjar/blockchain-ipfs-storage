<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secure File Uploader with Encryption + IPFS + Ethereum</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 30px 20px; text-align: center; max-width: 700px; margin: auto; }
  input[type="file"], input[type="text"] { margin: 10px 0; padding: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
  button { background-color: #007bff; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin: 8px 0; width: 100%; max-width: 300px; font-size: 14px; }
  #status { margin-top: 15px; font-weight: 600; white-space: pre-line; text-align: left; background: #fff; border: 1px solid #ccc; padding: 10px; min-height: 120px; max-height: 300px; overflow-y: auto; margin-left: auto; margin-right: auto; box-shadow: 0 0 6px rgba(0,0,0,0.1); font-family: Consolas, monospace; font-size: 13px; line-height: 1.2em; }
  #results { margin-top: 20px; text-align: left; font-family: Consolas, monospace; background: #fff; padding: 10px; border: 1px solid #ccc; box-shadow: 0 0 6px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<h1>Upload File to IPFS + Ethereum with Encryption</h1>
<input type="file" id="fileInput" />
<button id="uploadButton">Run Test (N times)</button>
<pre id="status"></pre>
<div id="results"></div>

<script>
const N_RUNS = 5; // number of repetitions
const JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiIzNTgwMTRmMy1kMWVkLTRmMDgtYjg1Ni0zMzY3ZDhlM2VjZmYiLCJlbWFpbCI6Inl1c3JhLm5hamphci4yMDExQGdtYWlsLmNvbSIsImVtYWlsX3ZlcmlmaWVkIjp0cnVlLCJwaW5fcG9saWN5Ijp7InJlZ2lvbnMiOlt7ImRlc2lyZWRSZXBsaWNhdGlvbkNvdW50IjoxLCJpZCI6IkZSQTEifSx7ImRlc2lyZWRSZXBsaWNhdGlvbkNvdW50IjoxLCJpZCI6Ik5ZQzEifV0sInZlcnNpb24iOjF9LCJtZmFfZW5hYmxlZCI6ZmFsc2UsInN0YXR1cyI6IkFDVElWRSJ9LCJhdXRoZW50aWNhdGlvblR5cGUiOiJzY29wZWRLZXkiLCJzY29wZWRLZXlLZXkiOiJjMmQ1OWU0NmMyYzIzZjQ1M2M2ZiIsInNjb3BlZEtleVNlY3JldCI6IjFiZjY4ZmFkY2JiMjcxNjEzZDEyMmU1NzAxZDMwMWJmMWI0NTJjZDhjZWIyZmY3MGE3ZjQ0Y2Y5OWNkMjgyYjMiLCJleHAiOjE3ODU1ODkwMjB9.qK_YdSw3aOnk_obTVCrEtRXVq_qYxp9v4AcIiS3kT68';
const contractAddress = '0x7EF2e0048f5bAeDe046f6BF797943daF4ED8CB47';
const contractABI = [{ "inputs": [{ "internalType": "string", "name": "ipfsHash", "type": "string" }], "name": "uploadHash", "outputs": [], "stateMutability": "nonpayable", "type": "function" }];

function logStatus(msg) {
  const status = document.getElementById('status');
  status.textContent += msg + '\n';
  status.scrollTop = status.scrollHeight;
}

function calcStats(values) {
  const mean = values.reduce((a, b) => a + b, 0) / values.length;
  const variance = values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length;
  return { mean, sd: Math.sqrt(variance) };
}

async function encryptFile(file) {
  const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  const rawKey = await crypto.subtle.exportKey("raw", key);
  const keyBase64 = btoa(String.fromCharCode(...new Uint8Array(rawKey)));
  const fileBuffer = await file.arrayBuffer();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encryptedBuffer = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, fileBuffer);
  const encryptedBlob = new Blob([iv, new Uint8Array(encryptedBuffer)], { type: 'application/octet-stream' });
  return { encryptedFile: encryptedBlob, encryptionKey: keyBase64 };
}

async function measureAndUpload(file) {
  const timings = {};
  const t0 = performance.now();
  
  // Encryption
  const encStart = performance.now();
  const { encryptedFile, encryptionKey } = await encryptFile(file);
  timings.encryption = (performance.now() - encStart) / 1000;

  // IPFS upload
  const ipfsStart = performance.now();
  const formData = new FormData();
  formData.append('file', encryptedFile, file.name + '.enc');
  const response = await axios.post('https://api.pinata.cloud/pinning/pinFileToIPFS', formData, {
    maxContentLength: Infinity,
    headers: { Authorization: `Bearer ${JWT}`, 'Content-Type': 'multipart/form-data' }
  });
  timings.upload = (performance.now() - ipfsStart) / 1000;
  const ipfsHash = response.data.IpfsHash;

  // Ethereum transaction
  if (!window.ethereum) throw new Error("MetaMask not found");
  await window.ethereum.request({ method: 'eth_requestAccounts' });
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  const contract = new ethers.Contract(contractAddress, contractABI, signer);
  const ethStart = performance.now();
  const tx = await contract.uploadHash(ipfsHash, { gasLimit: 300000 });
  await tx.wait();
  timings.ethereum = (performance.now() - ethStart) / 1000;

  // Retrieval
  const retStart = performance.now();
  await fetch(`https://gateway.pinata.cloud/ipfs/${ipfsHash}`);
  timings.retrieval = (performance.now() - retStart) / 1000;

  timings.total = (performance.now() - t0) / 1000;
  return timings;
}

document.getElementById('uploadButton').onclick = async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert('Please select a file');
  document.getElementById('status').textContent = '';
  const allTimings = { encryption: [], upload: [], ethereum: [], retrieval: [], total: [] };

  for (let i = 0; i < N_RUNS; i++) {
    logStatus(`Run ${i + 1} of ${N_RUNS}...`);
    try {
      const timings = await measureAndUpload(file);
      Object.keys(allTimings).forEach(k => allTimings[k].push(timings[k]));
      logStatus(`✔ Run ${i + 1} complete: ${JSON.stringify(timings)}`);
    } catch (err) {
      logStatus(`❌ Error in run ${i + 1}: ${err.message}`);
    }
  }

  // Display results
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = "<h3>Average Performance (mean ± sd)</h3>";
  const metrics = Object.keys(allTimings);
  resultsDiv.innerHTML += "<pre>" + metrics.map(m => {
    const { mean, sd } = calcStats(allTimings[m]);
    return `${m}: ${mean.toFixed(2)} ± ${sd.toFixed(2)} seconds`;
  }).join('\n') + "</pre>";
};
</script>
</body>
</html>
